name: Bug report
description: Report a reproducible bug
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Short description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands and inputs
      placeholder: |
        1. bun run ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Bun version, OS, terminal, and relevant package versions
      placeholder: |
        bun --version:
        OS:
        terminal:
    validations:
      required: true
