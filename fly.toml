# Fly.io config for a single-machine Lento server.
#
# Lento stores everything in one SQLite file, so it runs as exactly ONE machine
# with ONE volume. Do not scale the machine count above 1.
#
# First deploy: see docs/deploying.md.

app = "lento"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  LENTO_SERVER_HOSTNAME = "0.0.0.0"
  LENTO_DATABASE_PATH = "/data/lento.sqlite"
  LENTO_ENABLE_WEB_UI = "true"
  LENTO_REQUIRE_IDENTITY_FOR_WRITES = "true"
  LENTO_LOG_REQUESTS = "true"
  # Fly's proxy sets this header to the real client address.
  LENTO_CLIENT_IP_HEADER = "fly-client-ip"
  # Secrets, set with `fly secrets set`: LENTO_SERVER_SECRET, LENTO_ADMIN_TOKEN (optional).

[mounts]
  source = "lento_data"
  destination = "/data"
  # Days Fly keeps its daily volume snapshots (1 to 60, default 5).
  # Applies to volumes that `fly deploy` creates.
  snapshot_retention = 30

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the one machine running: stopping it would take the network offline.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
